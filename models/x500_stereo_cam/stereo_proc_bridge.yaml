# ROS2-Gazebo Bridge for stereo_image_proc pipeline
# Gazebo Harmonic publishes camera topics under /model/<model_name>/<topic>
# Maps to /stereo/left/ and /stereo/right/ namespaces expected by stereo_image_proc.

# Left camera image
- gz_topic_name: "/left/image_raw"
  ros_topic_name: "/stereo/left/image_raw"
  ros_type_name:  "sensor_msgs/msg/Image"
  gz_type_name:   "gz.msgs.Image"

# Left camera info (auto-published by Gazebo alongside image)
- gz_topic_name: "/left/camera_info"
  ros_topic_name: "/stereo/left/camera_info"
  ros_type_name:  "sensor_msgs/msg/CameraInfo"
  gz_type_name:   "gz.msgs.CameraInfo"

# Right camera image
- gz_topic_name: "/right/image_raw"
  ros_topic_name: "/stereo/right/image_raw"
  ros_type_name:  "sensor_msgs/msg/Image"
  gz_type_name:   "gz.msgs.Image"

# Right camera info
- gz_topic_name: "/right/camera_info"
  ros_topic_name: "/stereo/right/camera_info"
  ros_type_name:  "sensor_msgs/msg/CameraInfo"
  gz_type_name:   "gz.msgs.CameraInfo"

# Sim clock — Gazebo Harmonic publishes on /world/<world_name>/clock
# For baylands world: /world/baylands/clock
- gz_topic_name: "/world/baylands/clock"
  ros_topic_name: "/clock"
  ros_type_name:  "rosgraph_msgs/msg/Clock"
  gz_type_name:   "gz.msgs.Clock"
